<!DOCTYPE html>
<html lang="hi">
<head>

<title>Vyapaar Bill (React)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Hind:wght@400;500;600&display=swap">
<style>

:focus-visible{outline:2px solid var(--pri);outline-offset:1px}

.btn.g{background:linear-gradient(135deg,#0b8f8e,var(--pri2))}.btn.alt{background:var(--soft);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad);box-shadow:none}.btn.sm{padding:5px 10px;font-size:13px}
.warn{background:#fff3d6;color:#5a3d00;border-left:4px solid var(--amb);padding:10px 14px;border-radius:8px;margin-bottom:16px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--pri);background:var(--soft);padding:8px 6px}td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{margin:0;padding:6px;min-width:62px}.r{text-align:right}.empty{color:var(--mute);padding:18px;text-align:center}
.tot{margin-left:auto;max-width:320px;margin-top:14px}.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .t{font:800 21px 'Plus Jakarta Sans',sans-serif;color:var(--pri);border-top:2px solid var(--pri);margin-top:6px;padding-top:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;font:600 14px Hind,sans-serif;color:var(--ink)}
.tile.on{border-color:var(--pri);box-shadow:0 6px 16px rgba(91,75,219,.25)}.tile i{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;margin:0 auto 8px;font-size:27px;font-style:normal}
.tile small{display:block;color:var(--mute);font-weight:400}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:10px}.stats b{display:block;font:800 21px 'Plus Jakarta Sans',sans-serif;color:var(--pri)}.stats span{font-size:13px;color:var(--mute)}
.bd{color:#fff;padding:2px 9px;border-radius:10px;font-size:12px;white-space:nowrap}
.fl{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:10px 18px;border-radius:10px;z-index:30}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.72);overflow:auto;z-index:20;padding:16px 10px}
.bar{max-width:780px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sheet{background:#fff;color:#142038;max-width:780px;margin:0 auto;padding:28px;border-radius:6px;font-size:14px}
.sheet h2{font-size:23px;color:#312e81}.sheet small{color:#55607a}.sheet th{background:#1e1b4b;color:#fff}.sheet td{border-color:#e1e7f3}
.sh{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:3px solid #0ea5a4;padding-bottom:12px;margin-bottom:14px}.rt{text-align:right}
@media print{body>*:not(#ov){display:none!important}.ov{position:static;background:none;padding:0}.bar{display:none}.sheet{padding:0}}
</style>
</head>

<script>

const seed=()=>SEEDS.map((r,i)=>{const[n,ic,co,ps]=r.split('|');return{id:'c'+i,name:n,icon:ic,color:co,products:ps.split(';').map((p,j)=>{const[a,b,c,d]=p.split(',');return{id:'p'+i+'_'+j,name:a,rate:+b,unit:c,gst:+d,hsn:''}})}});

function words(n){let t=Math.round((+n||0)*100),r=Math.floor(t/100),p=t%100;const w=x=>HW[x-1],h=x=>{let s='';if(x>=100){s+=w(Math.floor(x/100))+' sau ';x%=100}return s+(x?w(x)+' ':'')};let s='';const cr=Math.floor(r/1e7);r%=1e7;const la=Math.floor(r/1e5);r%=1e5;const th=Math.floor(r/1e3);r%=1e3;if(cr)s+=h(cr)+'crore ';if(la)s+=w(la)+' lakh ';if(th)s+=w(th)+' hazaar ';s+=h(r);return (s.trim()||'Shunya')+' rupaye'+(p?' aur '+w(p)+' paise':'')+' sirf'}
const isInter=(a,b)=>{a=(a||'').trim().toLowerCase();b=(b||'').trim().toLowerCase();return !!a&&!!b&&a!==b};
function calc(items,disc){let sub=0,g=0;items.forEach(i=>{const a=i.qty*i.rate;sub+=a;g+=a*i.gst/100});disc=Math.min(+disc||0,sub);g*=sub?(sub-disc)/sub:0;return{sub,disc,gst:g,total:sub-disc+g}}
const newDraft=()=>({edit:null,items:[],buyer:{name:'',phone:'',addr:'',gstin:'',state:''},eway:{no:'',vehicle:'',from:'',to:''},disc:'',pay:'Cash',paid:'',date:today()});
const due=b=>Math.max(0,b.t.total-b.paid);
let CUR={};const bzf=b=>({...b.biz,logo:CUR.logo,sign:CUR.sign,upi:b.biz.upi||CUR.upi});
const adj=(cs,items,s)=>cs.map(c=>({...c,products:c.products.map(p=>{const q=p.stock!=null?items.filter(i=>i.co===c.id&&i.name===p.name).reduce((a,i)=>a+i.qty,0):0;return q?{...p,stock:Math.max(0,p.stock+s*q)}:p})}));

async function saveFile(name,data){try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code==='declined')return}const u=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function makePdf(b){const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),M=14,E=196,X=bzf(b);let y=18;
const R=n=>'Rs. '+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),t=(s,x,z,o)=>d.text(String(s),x,z,o),f=z=>{d.setFont('helvetica','bold');d.setFontSize(z)},ink=()=>d.setTextColor(10,18,35);
d.setFillColor(30,27,75);d.rect(0,0,210,40,'F');d.setFillColor(14,165,164);d.rect(0,40,210,1.8,'F');d.setTextColor(255);
let lx=M;if(X.logo){try{const p=d.getImageProperties(X.logo),w=Math.min(34,24*p.width/p.height);d.setFillColor(255);d.roundedRect(M-1,6,w+2,26,1.5,1.5,'F');d.addImage(X.logo,'PNG',M,7,w,24);lx=M+w+5}catch(e){}}f(18);t(X.name||'Vyapaar Bill',lx,y);f(9);let ly=y+5;[X.addr,X.phone&&'Phone: '+X.phone,X.gstin&&'GSTIN: '+X.gstin].filter(Boolean).forEach(s=>d.splitTextToSize(s,100).forEach(l=>{t(l,lx,ly);ly+=4.5}));
f(15);t(b.returned?'CREDIT NOTE':'TAX INVOICE',E,y,{align:'right'});f(9);t('No: '+b.no,E,y+6,{align:'right'});t('Date: '+fmtD(b.date),E,y+11,{align:'right'});t('Payment: '+b.pay,E,y+16,{align:'right'});
y=52;ink();d.setTextColor(67,56,202);f(10);t('Bill to',M,y);ink();y+=5;
[b.buyer.name,b.buyer.addr,b.buyer.phone&&'Phone: '+b.buyer.phone,b.buyer.gstin&&'GSTIN: '+b.buyer.gstin,b.buyer.state&&'State: '+b.buyer.state].filter(Boolean).forEach(s=>d.splitTextToSize(s,120).forEach(l=>{t(l,M,y);y+=5}));
y+=4;d.setFillColor(30,27,75);d.rect(M,y-4.5,E-M,7,'F');d.setTextColor(255);f(9);t('#',M+2,y);t('Item',M+10,y);t('Qty',112,y,{align:'right'});t('Rate',145,y,{align:'right'});t('GST%',162,y,{align:'right'});t('Amount',E-2,y,{align:'right'});y+=7;
b.items.forEach((i,n)=>{const ls=d.splitTextToSize(i.name+(i.coName?' ('+i.coName+')':'')+(i.hsn?' [HSN '+i.hsn+']':''),70),h=ls.length*4.6+2;if(y+h>270){d.addPage();y=18}if(n%2){d.setFillColor(236,238,252);d.rect(M,y-4,E-M,h,'F')}ink();f(9);t(n+1,M+2,y);ls.forEach((l,k)=>t(l,M+10,y+k*4.6));t(i.qty+' '+i.unit,112,y,{align:'right'});t(R(i.rate),145,y,{align:'right'});t(i.gst+'%',162,y,{align:'right'});t(R(i.qty*i.rate),E-2,y,{align:'right'});y+=h;d.setDrawColor(120);d.setLineWidth(.3);d.line(M,y-3.2,E,y-3.2)});
if(y>205){d.addPage();y=18}y+=4;
const tr=(l,v,bd)=>{if(bd){d.setFillColor(14,165,164);d.roundedRect(133,y-6,64,9,1.5,1.5,'F');d.setTextColor(255)}f(bd?12:10);t(l,135,y);t(v,E-1,y,{align:'right'});if(bd)ink();y+=bd?9:6};
ink();tr('Subtotal',R(b.t.sub));if(b.t.disc)tr('Discount','- '+R(b.t.disc));if(b.inter)tr('IGST',R(b.t.gst));else{tr('CGST',R(b.t.gst/2));tr('SGST',R(b.t.gst/2))}y+=2;tr('Total',R(b.t.total),1);tr('Mila',R(b.paid));tr('Baaki',R(due(b)));
f(9);d.setTextColor(30,27,75);d.splitTextToSize('In words: '+words(b.t.total),E-M).forEach(l=>{t(l,M,y);y+=4.6});
const e=b.eway||{};if(Object.values(e).some(v=>String(v).trim())){y+=3;ink();t('E-way bill',M,y);y+=4.6;t('No: '+(e.no||'-')+'   Vehicle: '+(e.vehicle||'-'),M,y);y+=4.6;t('From: '+(e.from||'-')+'   To: '+(e.to||'-'),M,y);y+=4.6}
y+=2;if(y>235){d.addPage();y=18}ink();{const u=!b.returned&&due(b)>.005?upiUrl(b):'';if(u&&window.QRCode){const h=document.createElement('div');new QRCode(h,{text:u,width:120,height:120});const cv=h.querySelector('canvas');if(cv){d.addImage(cv.toDataURL('image/png'),'PNG',M,y,28,28);f(8);t('UPI se pay karo',M,y+31)}}if(X.sign){try{d.addImage(X.sign,'PNG',150,y,36,16)}catch(e){}}f(8);t('Authorised signature',E,y+22,{align:'right'})}y+=36;f(8);d.setTextColor(40);d.splitTextToSize(X.note||'Thank you.',E-M).forEach(l=>{t(l,M,y);y+=4});

const summary=b=>(b.biz.name||'')+'\nBill '+b.no+' ('+fmtD(b.date)+')\nKul: '+inr(b.t.total)+(due(b)>0?'\nBaaki: '+inr(due(b)):'')+'\nDhanyavaad!';
const waLink=b=>{const p=(b.buyer.phone||'').replace(/\D/g,'');return 'https://wa.me/'+(p.length===10?'91'+p:p)+'?text='+encodeURIComponent(summary(b))};
function Inv({b}){const x=bzf(b),g=b.t.gst,e=b.eway||{},u=!b.returned&&due(b)>.005?upiUrl(b):'';return html`<div class="sheet">
<div class="sh"><div>${x.logo&&html`<img src=${x.logo} alt="" style=${{height:46,float:'left',marginRight:10}}/>`}<h2>${x.name||'Aapka Vyapaar'}</h2><small>${x.addr}${x.phone?' | Ph: '+x.phone:''}${x.gstin?' | GSTIN: '+x.gstin:''}</small></div><div class="rt"><h2>${b.returned?'CREDIT NOTE':'TAX INVOICE'}</h2><small>${b.no} | ${fmtD(b.date)}<br/>Payment: ${b.pay}</small></div></div>

${Object.values(e).some(v=>v)?html`<p><small><b>E-way bill:</b> ${e.no||'-'} | Gaadi: ${e.vehicle||'-'} | ${e.from||'-'} se ${e.to||'-'}</small></p>`:''}

function BillView({b,close,pay,toast,loadDraft,ret}){const [amt,setAmt]=useState(''),dl=()=>{saveFile(b.no+'.pdf',makePdf(b).output('arraybuffer'))};
const share=async()=>{try{const file=new File([makePdf(b).output('blob')],b.no+'.pdf',{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:b.no,text:summary(b)});return}}catch(e){if(e&&e.name==='AbortError')return}dl();toast('PDF save ho gayi. Ab WhatsApp mein attach karke bhejo')};
return html`<div class="ov" id="ov"><div class="bar"><button class="btn g" onClick=${share}>PDF share (WhatsApp)</button><button class="btn" onClick=${dl}>PDF download</button><a class="btn alt" target="_blank" rel="noopener" href=${waLink(b)}>WhatsApp text</a><button class="btn alt" onClick=${()=>window.print()}>Print</button><button class="btn alt" onClick=${()=>loadDraft(b.id,0)}>Copy</button>${!b.returned&&html`<button class="btn alt" onClick=${()=>loadDraft(b.id,1)}>Edit</button><${Sure} label="Return" on=${()=>ret(b.id)}/>`}<button class="btn alt" onClick=${close}>Band karo</button></div>
${due(b)>.005&&!b.returned&&html`<div class="bar"><input type="number" min="0" style=${{maxWidth:240,margin:0}} placeholder=${'Baaki '+inr(due(b))+', kitna mila?'} value=${amt} onChange=${e=>setAmt(e.target.value)}/><button class="btn" onClick=${()=>{if(+amt>0){pay(b.id,+amt);setAmt('')}}}>Payment jodo</button></div>`}<${Inv} b=${b}/></div>`}
function App(){const [S,setS]=useState(load),[tab,setTab]=useState('bill'),[D,setD]=useState(newDraft),[view,setView]=useState(null),[msg,setMsg]=useState(''),[ok,setOk]=useState(false);
useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},[S]);
const toast=m=>{setMsg(m);setTimeout(()=>setMsg(''),2600)};CUR=S.biz;
const addToBill=(c,p)=>{setD(d=>({...d,items:[...d.items,{name:p.name,co:c.id,coName:c.name,qty:1,unit:p.unit,rate:p.rate,gst:p.gst,hsn:p.hsn||''}]}));toast(p.name+' bill mein joda gaya')};
const onSave=()=>{if(!D.items.length)return toast('Kam se kam ek item jodo');if(!D.buyer.name.trim())return toast('Grahak ka naam likho');const old=S.bills.find(x=>x.id===D.edit),c=calc(D.items,D.disc),b={id:old?old.id:uid('b'),no:old?old.no:'INV-'+pad(S.seq),date:D.date||today(),buyer:{...D.buyer},eway:{...D.eway},items:D.items,disc:c.disc,pay:D.pay,biz:{...S.biz,logo:'',sign:''},inter:isInter(S.biz.state,D.buyer.state),t:c};b.paid=old?Math.min(old.paid,c.total):D.paid!==''?Math.min(+D.paid||0,c.total):(D.pay.startsWith('Udhaar')?0:c.total);setS(s=>({...s,seq:old?s.seq:s.seq+1,companies:adj(old?adj(s.companies,old.items,1):s.companies,b.items,-1),bills:[b,...s.bills.filter(x=>x.id!==b.id)]}));setD(newDraft());setView(b.id);toast('Bill save ho gaya')};
const pay=(id,a)=>{setS(s=>({...s,bills:s.bills.map(b=>b.id===id?{...b,paid:Math.min(b.t.total,b.paid+a)}:b)}));toast('Payment jud gayi')};
const loadDraft=(id,ed)=>{const b=S.bills.find(x=>x.id===id);setD({edit:ed?id:null,items:b.items.map(i=>({...i})),buyer:{state:'',...b.buyer},eway:{no:'',vehicle:'',from:'',to:'',...b.eway},disc:b.disc||'',pay:b.pay,paid:'',date:ed?b.date:today()});setView(null);setTab('bill')};
const ret=id=>setS(s=>{const b=s.bills.find(x=>x.id===id);return{...s,companies:adj(s.companies,b.items,1),bills:s.bills.map(x=>x.id===id?{...x,returned:true}:x)}}),startFor=b=>{setD({...newDraft(),buyer:{state:'',...b}});setTab('bill')};
const T=[['dash','Dashboard'],['bill','Naya Bill'],['co','Companies'],['cust','Grahak'],['hist','History'],['biz','Meri Details']],vb=S.bills.find(b=>b.id===view);if(S.pin&&!ok)return html`<${Lock} pin=${S.pin} ok=${()=>setOk(true)}/>`;
return html`<div><header><h1>Vyapaar Bill</h1><p>Bill banao, company ke hisaab se becho, history rakho</p><nav>${T.map(([k,l])=>html`<button key=${k} class=${tab===k?'on':''} onClick=${()=>setTab(k)}>${l}${k==='bill'&&D.items.length?html`<b>${D.items.length}</b>`:''}</button>`)}</nav></header>
<main>${tab==='dash'?html`<${Dash} S=${S}/>`:tab==='cust'?html`<${Cust} S=${S} start=${startFor}/>`:tab==='bill'?html`<${BillTab} S=${S} D=${D} setD=${setD} onSave=${onSave} toast=${toast}/>`:tab==='co'?html`<${Companies} S=${S} setS=${setS} addToBill=${(c,p)=>{addToBill(c,p)}}/>`:tab==='hist'?html`<${History} S=${S} setS=${setS} open=${setView}/>`:html`<${Details} key=${S.biz.name} S=${S} setS=${setS} toast=${toast}/>`}</main>
${vb&&html`<${BillView} b=${vb} close=${()=>setView(null)} pay=${pay} toast=${toast} loadDraft=${loadDraft} ret=${ret}/>`}${msg&&html`<div id="toast" role="status">${msg}</div>`}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
